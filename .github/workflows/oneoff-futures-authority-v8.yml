name: One-shot Futures Authority Repair V8

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/restore-futures-reviewed-authority-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - run: |
          git config user.name 'TradingDatas Repair Bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Apply V7 durable repair and update receipt audit expectation
        run: |
          set -euo pipefail
          STEP_NAME='Apply V6 repair and normalize optional reviewed nulls' TARGET=/tmp/v7-repair.sh python - <<'PY'
          import os,yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/oneoff-futures-authority-v7.yml').read_text(encoding='utf-8'))
          matches=[s['run'] for s in doc['jobs']['repair']['steps'] if s.get('name')==os.environ['STEP_NAME']]
          if len(matches)!=1: raise SystemExit('V7 repair step not unique')
          Path(os.environ['TARGET']).write_text(matches[0]+'\n',encoding='utf-8')
          PY
          bash /tmp/v7-repair.sh
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_collect_provider_dataset.py')
          text=path.read_text(encoding='utf-8')
          old='''    assert json.loads(receipt[1])["errors"] == ["validation_failed"]\n\n\ndef test_fut_index_daily_accepts_response_schema_covering_requested_fields(\n'''
          new='''    assert json.loads(receipt[1])["errors"] == [\n        "validation_failed",\n        "response_field_coverage",\n    ]\n\n\ndef test_fut_index_daily_accepts_response_schema_covering_requested_fields(\n'''
          if new not in text:
              if text.count(old)!=1:
                  raise SystemExit('fut_index_daily receipt expectation anchor drifted')
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Canonical rebuild
        run: |
          set -euo pipefail
          STEP_NAME='Canonical rebuild' TARGET=/tmp/v7-rebuild.sh python - <<'PY'
          import os,yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/oneoff-futures-authority-v7.yml').read_text(encoding='utf-8'))
          matches=[s['run'] for s in doc['jobs']['repair']['steps'] if s.get('name')==os.environ['STEP_NAME']]
          if len(matches)!=1: raise SystemExit('V7 rebuild step not unique')
          Path(os.environ['TARGET']).write_text(matches[0]+'\n',encoding='utf-8')
          PY
          bash /tmp/v7-rebuild.sh

      - name: Focused verification and deterministic rebuild
        run: |
          set -euo pipefail
          STEP_NAME='Focused verification and deterministic rebuild' TARGET=/tmp/v7-verify.sh python - <<'PY'
          import os,yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/oneoff-futures-authority-v7.yml').read_text(encoding='utf-8'))
          matches=[s['run'] for s in doc['jobs']['repair']['steps'] if s.get('name')==os.environ['STEP_NAME']]
          if len(matches)!=1: raise SystemExit('V7 verify step not unique')
          Path(os.environ['TARGET']).write_text(matches[0]+'\n',encoding='utf-8')
          PY
          bash /tmp/v7-verify.sh

      - name: Commit durable result and remove repair workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/oneoff-promote-futures-reviewed-authority.yml .github/workflows/oneoff-futures-authority-v2.yml .github/workflows/oneoff-futures-authority-v3.yml .github/workflows/oneoff-futures-authority-v4.yml .github/workflows/oneoff-futures-authority-v5.yml .github/workflows/oneoff-futures-authority-v6.yml .github/workflows/oneoff-futures-authority-v7.yml .github/workflows/oneoff-futures-authority-v8.yml
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: persist futures reviewed authority across rebuilds'
          git push origin HEAD:${{ github.head_ref }}
