name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'public-web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to publish after a trusted green merge
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

concurrency:
  group: tradingdatas-cloudflare-pages-main
  cancel-in-progress: false

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/ --project-name=tradingdatas-admin --branch=main

      - name: Read back published static route
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://tradingdatas-admin.pages.dev/ \
            | grep -iF '<!doctype html>'

  deploy-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Deploy public website Worker with session secret
        working-directory: public-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SESSION_ENCRYPTION_KEY"
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{SESSION_ENCRYPTION_KEY: env.SESSION_ENCRYPTION_KEY}' \
            > "$secrets_file"
          npx --yes wrangler@4.127.1 deploy --config wrangler.jsonc \
            --secrets-file "$secrets_file"

      - name: Read back public routes and exact asset
        run: |
          set -euo pipefail
          expected_asset="$(sed -nE 's/.*src="\/assets\/([^"]+\.js)".*/\1/p' public-web/dist/client/index.html)"
          test -n "$expected_asset"
          for route in / /account/ /data/ /research/ /pricing/; do
            published=false
            for attempt in {1..12}; do
              if readback="$(curl --fail --show-error --silent --retry 3 --retry-all-errors \
                --connect-timeout 10 --max-time 30 \
                --write-out $'\n%{http_code}\n%{url_effective}' \
                "https://tradingdatas.com${route}")"; then
                effective_url="${readback##*$'\n'}"
                readback="${readback%$'\n'*}"
                response_status="${readback##*$'\n'}"
                body="${readback%$'\n'*}"
                if [[ "$response_status" = 200 ]] \
                  && [[ "$effective_url" = "https://tradingdatas.com${route}" ]] \
                  && grep -qiF '<!doctype html>' <<<"$body" \
                  && grep -qF "$expected_asset" <<<"$body"; then
                  published=true
                  break
                fi
              fi
              sleep 5
            done
            if [[ "$published" != true ]]; then
              echo "Published asset $expected_asset was not visible at $route after 12 attempts." >&2
              exit 1
            fi
          done
