name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'

permissions:
  contents: read

concurrency:
  group: tradingdatas-cloudflare-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/ --project-name=tradingdatas-admin --branch=main
