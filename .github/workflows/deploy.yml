name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'public-web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to publish after a Controller-gated auto-merge
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

concurrency:
  group: tradingdatas-cloudflare-pages-main
  cancel-in-progress: false

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/ --project-name=tradingdatas-admin --branch=main

      - name: Read back published static route
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://tradingdatas-admin.pages.dev/ \
            | grep -iF '<!doctype html>'

  deploy-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Configure public Worker session secret
        working-directory: public-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$SESSION_ENCRYPTION_KEY"
          printf '%s' "$SESSION_ENCRYPTION_KEY" \
            | npx --yes wrangler@4.127.1 secret put SESSION_ENCRYPTION_KEY --config wrangler.jsonc

      - name: Deploy public website Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: public-web
          wranglerVersion: "4.127.1"
          command: deploy --config wrangler.jsonc

      - name: Read back public routes and exact asset
        run: |
          set -euo pipefail
          expected_asset="$(sed -nE 's/.*src="\/assets\/([^"]+\.js)".*/\1/p' public-web/dist/client/index.html)"
          test -n "$expected_asset"
          for route in / /account/ /data/ /research/ /pricing/; do
            readback="$(curl --fail --show-error --silent --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --write-out $'\n%{http_code}\n%{url_effective}' \
              "https://tradingdatas.com${route}")"
            effective_url="${readback##*$'\n'}"
            readback="${readback%$'\n'*}"
            response_status="${readback##*$'\n'}"
            body="${readback%$'\n'*}"
            test "$response_status" = 200
            test "$effective_url" = "https://tradingdatas.com${route}"
            grep -qiF '<!doctype html>' <<<"$body"
            grep -qF "$expected_asset" <<<"$body"
          done
