name: One-shot Persist Futures Durable V9

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  persist:
    if: github.head_ref == 'codex/restore-futures-reviewed-authority-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - run: |
          git config user.name 'TradingDatas Repair Bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Reproduce the already-verified V8 durable repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          doc=yaml.safe_load(Path('.github/workflows/oneoff-futures-authority-v8.yml').read_text(encoding='utf-8'))
          steps=doc['jobs']['repair']['steps']
          wanted=['Apply V7 durable repair and update receipt audit expectation','Canonical rebuild','Focused verification and deterministic rebuild']
          for index,name in enumerate(wanted):
              matches=[s['run'] for s in steps if s.get('name')==name]
              if len(matches)!=1: raise SystemExit(f'V8 step {name!r} not unique')
              path=Path(f'/tmp/v8-{index}.sh')
              path.write_text(matches[0]+'\n',encoding='utf-8')
          PY
          bash /tmp/v8-0.sh
          bash /tmp/v8-1.sh
          bash /tmp/v8-2.sh

      - name: Commit only durable non-workflow files
        run: |
          set -euo pipefail
          expected=(
            config/provider_native_activation_waves.v1.yaml
            config/provider_native_dataset_registry.yaml
            config/tushare_cadence_policy.v1.yaml
            config/tushare_request_observations.v1.yaml
            config/tushare_reviewed_contracts.v1.yaml
            config/tushare_upstream_contracts.v1.yaml
            tests/test_collect_provider_dataset.py
            tests/test_compile_tushare_runtime_contracts.py
            tools/compile_tushare_runtime_contracts.py
          )
          mapfile -t actual < <(git status --porcelain | awk '{print $2}' | grep -v '^\.github/workflows/' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'durable changed files:\n%s\n' "${actual[*]}"
          if [[ "$(printf '%s\n' "${actual[@]}")" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
            echo 'Unexpected durable diff; fail closed.'
            exit 1
          fi
          git add -- "${expected[@]}"
          git diff --cached --check
          git commit -m 'fix: persist futures reviewed authority across rebuilds'
          git push origin HEAD:${{ github.head_ref }}
