name: One-shot Futures Authority Repair V3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/restore-futures-reviewed-authority-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name 'TradingDatas Repair Bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Fix compiler order and reviewed authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import hashlib, subprocess, yaml

          PRE='aa92d22bc9f2cafd8a944d256509ccc037a2c20b'
          BAD='66ac446d97c212571014fcdb0f9841aecef53a76'
          UP=Path('config/tushare_upstream_contracts.v1.yaml')
          REV=Path('config/tushare_reviewed_contracts.v1.yaml')
          CAD=Path('config/tushare_cadence_policy.v1.yaml')
          OBS=Path('config/tushare_request_observations.v1.yaml')
          COMP=Path('tools/compile_tushare_runtime_contracts.py')

          source=COMP.read_text(encoding='utf-8')
          old='''    # Reuse the existing strict registry validator for every pre-existing\n    # contract field, then attach the official input contract. The downstream\n    # registry compiler adopts this new field in a separate integration step.\n    validated = load_upstream_contract_bundle(result)\n    with_inputs = [\n        _with_input_fields(contract, input_fields_by_api[str(contract["api_name"])])\n        for contract in validated["contracts"]\n    ]\n    validated["contracts"] = [\n        _with_request_observation(contract, request_by_api[str(contract["api_name"])])\n        for contract in with_inputs\n    ]\n    try:\n        validated_final_bundle = load_upstream_contract_bundle(validated)\n    except ValueError as exc:\n        raise RuntimeContractCompilationError(\n            f"compiled runtime bundle is invalid: {exc}"\n        ) from exc\n    _registered_seed_requirements(validated_final_bundle["contracts"], request_by_api)\n    return validated\n'''
          new='''    # The strict registry schema includes input-field and runtime-observation\n    # fields. Build the complete contract first, then validate once. Validating\n    # the partial catalog contract here would reject fields that are attached\n    # by the next two deterministic projection steps.\n    with_inputs = [\n        _with_input_fields(contract, input_fields_by_api[str(contract["api_name"])])\n        for contract in result["contracts"]\n    ]\n    result["contracts"] = [\n        _with_request_observation(contract, request_by_api[str(contract["api_name"])])\n        for contract in with_inputs\n    ]\n    try:\n        validated = load_upstream_contract_bundle(result)\n    except ValueError as exc:\n        raise RuntimeContractCompilationError(\n            f"compiled runtime bundle is invalid: {exc}"\n        ) from exc\n    _registered_seed_requirements(validated["contracts"], request_by_api)\n    return validated\n'''
          if new not in source:
              if source.count(old)!=1:
                  raise SystemExit('runtime compiler validation-order anchor drifted')
              COMP.write_text(source.replace(old,new,1),encoding='utf-8')

          def gy(ref,path):
              doc=yaml.safe_load(subprocess.check_output(['git','show',f'{ref}:{path}']).decode())
              if not isinstance(doc,dict): raise SystemExit('historical bundle malformed')
              return doc
          def cmap(doc):
              rows=doc.get('contracts')
              if not isinstance(rows,list): raise SystemExit('contracts missing')
              return {r['api_name']:r for r in rows}

          pre=cmap(gy(PRE,str(UP))); bad=cmap(gy(BAD,str(UP)))
          cur=cmap(yaml.safe_load(UP.read_text(encoding='utf-8')))
          if set(pre)!=set(bad) or set(cur)!=set(pre): raise SystemExit('API set drifted')
          futures=sorted(api for api in pre if pre[api]!=bad[api] and api!='rt_min')
          expected=['fut_basic','fut_daily','fut_index_daily','fut_mapping','fut_settle','fut_weekly_monthly']
          if futures!=expected: raise SystemExit(f'unexpected futures set: {futures}')

          reviewed=yaml.safe_load(REV.read_text(encoding='utf-8'))
          cadence=yaml.safe_load(CAD.read_text(encoding='utf-8'))
          normalized=[]
          for item in reviewed['contracts']:
              api=item['api_name']; base=cur.get(api)
              if base is None: raise SystemExit(f'reviewed API missing: {api}')
              merged=deepcopy(base); merged.update(deepcopy(item)); normalized.append(merged)
          reviewed['contracts']=normalized
          existing={r['api_name']:r for r in reviewed['contracts']}
          for api in futures:
              hist=deepcopy(pre[api])
              if api in existing and existing[api]!=hist: raise SystemExit(f'conflicting reviewed {api}')
              if api not in existing: reviewed['contracts'].append(hist)
          reviewed['contracts']=sorted(reviewed['contracts'],key=lambda r:(r['api_name'],r['dataset_id']))
          REV.write_text(yaml.safe_dump(reviewed,allow_unicode=True,sort_keys=False,width=1000),encoding='utf-8')

          cent={r['api_name']:r for r in cadence['entries']}
          for api in futures:
              ent=cent[api]
              ent['cadence_class']=pre[api]['cadence_class']
              ent['freshness_sla_seconds']=pre[api]['freshness_sla_seconds']
              ent['reason_code']='reviewed_contract_exact'
          CAD.write_text(yaml.safe_dump(cadence,allow_unicode=True,sort_keys=False,width=1000),encoding='utf-8')

          obs=yaml.safe_load(OBS.read_text(encoding='utf-8'))
          obs['provenance']['reviewed_contract_bundle']['sha256']=hashlib.sha256(REV.read_bytes()).hexdigest()
          OBS.write_text(yaml.safe_dump(obs,allow_unicode=True,sort_keys=False,width=1000),encoding='utf-8')
          print('durable reviewed futures:', ', '.join(futures))
          PY

      - name: Rebuild canonical artifacts
        run: |
          set -euo pipefail
          python tools/compile_tushare_runtime_contracts.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,yaml
          p=Path('config/tushare_request_observations.v1.yaml'); u=Path('config/tushare_upstream_contracts.v1.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8')); d['provenance']['registered_contract_bundle']['sha256']=hashlib.sha256(u.read_bytes()).hexdigest()
          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=1000),encoding='utf-8')
          PY
          python tools/compile_provider_native_registry.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,yaml
          p=Path('config/provider_native_activation_waves.v1.yaml'); r=Path('config/provider_native_dataset_registry.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8')); d['input_hashes']['runtime_registry_sha256']=hashlib.sha256(r.read_bytes()).hexdigest()
          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=1000),encoding='utf-8')
          PY

      - name: Verify focused tests and rebuildability
        run: |
          set -euo pipefail
          python -m pytest tests/test_compile_tushare_runtime_contracts.py tests/test_compile_provider_native_registry.py tests/test_collect_provider_dataset.py -q --tb=short -x
          python tools/compile_tushare_runtime_contracts.py --output /tmp/runtime-rebuild.yaml
          python tools/compile_provider_native_registry.py --upstream-contracts /tmp/runtime-rebuild.yaml --output /tmp/registry-rebuild.yaml
          git diff --check

      - name: Commit durable repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/oneoff-promote-futures-reviewed-authority.yml .github/workflows/oneoff-futures-authority-v2.yml .github/workflows/oneoff-futures-authority-v3.yml
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: persist futures reviewed authority and runtime compiler schema'
          git push origin HEAD:${{ github.head_ref }}
