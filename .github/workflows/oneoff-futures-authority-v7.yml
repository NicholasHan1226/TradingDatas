name: One-shot Futures Authority Repair V7

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/restore-futures-reviewed-authority-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - run: |
          git config user.name 'TradingDatas Repair Bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Apply V6 repair and normalize optional reviewed nulls
        run: |
          set -euo pipefail
          STEP_NAME='Reuse reviewed-authority repair and fix optional request keys' TARGET=/tmp/v6-repair.sh python - <<'PY'
          import os, yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/oneoff-futures-authority-v6.yml').read_text(encoding='utf-8'))
          matches=[s['run'] for s in doc['jobs']['repair']['steps'] if s.get('name')==os.environ['STEP_NAME']]
          if len(matches)!=1: raise SystemExit('V6 repair step not unique')
          Path(os.environ['TARGET']).write_text(matches[0]+'\n',encoding='utf-8')
          PY
          bash /tmp/v6-repair.sh
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_compile_tushare_runtime_contracts.py')
          text=path.read_text(encoding='utf-8')
          old='''        for key in (\n            "probe_state",\n            "probe_block_reasons",\n            "ingest_contract_state",\n            "ingest_contract_block_reasons",\n        ):\n            compiled_contract.pop(key)\n        assert compiled_contract == contract\n'''
          new='''        for key in (\n            "probe_state",\n            "probe_block_reasons",\n            "ingest_contract_state",\n            "ingest_contract_block_reasons",\n        ):\n            compiled_contract.pop(key)\n        for key in ("request_window_policy", "resumable_fanout"):\n            if key not in contract and compiled_contract.get(key) is None:\n                compiled_contract.pop(key, None)\n        assert compiled_contract == contract\n'''
          if new not in text:
              if text.count(old)!=1: raise SystemExit('reviewed optional-null test anchor drifted')
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Canonical rebuild
        run: |
          set -euo pipefail
          STEP_NAME='Canonical rebuild' TARGET=/tmp/v6-rebuild.sh python - <<'PY'
          import os,yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/oneoff-futures-authority-v6.yml').read_text(encoding='utf-8'))
          matches=[s['run'] for s in doc['jobs']['repair']['steps'] if s.get('name')==os.environ['STEP_NAME']]
          if len(matches)!=1: raise SystemExit('V6 rebuild step not unique')
          Path(os.environ['TARGET']).write_text(matches[0]+'\n',encoding='utf-8')
          PY
          bash /tmp/v6-rebuild.sh

      - name: Focused verification and deterministic rebuild
        run: |
          set -euo pipefail
          STEP_NAME='Focused verification and deterministic rebuild' TARGET=/tmp/v6-verify.sh python - <<'PY'
          import os,yaml
          from pathlib import Path
          doc=yaml.safe_load(Path('.github/workflows/oneoff-futures-authority-v6.yml').read_text(encoding='utf-8'))
          matches=[s['run'] for s in doc['jobs']['repair']['steps'] if s.get('name')==os.environ['STEP_NAME']]
          if len(matches)!=1: raise SystemExit('V6 verify step not unique')
          Path(os.environ['TARGET']).write_text(matches[0]+'\n',encoding='utf-8')
          PY
          bash /tmp/v6-verify.sh

      - name: Commit durable result and remove repair workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/oneoff-promote-futures-reviewed-authority.yml .github/workflows/oneoff-futures-authority-v2.yml .github/workflows/oneoff-futures-authority-v3.yml .github/workflows/oneoff-futures-authority-v4.yml .github/workflows/oneoff-futures-authority-v5.yml .github/workflows/oneoff-futures-authority-v6.yml .github/workflows/oneoff-futures-authority-v7.yml
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix: persist futures reviewed authority across rebuilds'
          git push origin HEAD:${{ github.head_ref }}
