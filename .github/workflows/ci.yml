name: TradingDatas CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tradingdatas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

jobs:
  test:
    name: test-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate source identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run deterministic test shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: "4"
        run: |
          set -euo pipefail
          mapfile -t test_files < <(
            python - <<'PY'
          import os
          from pathlib import Path

          shard = int(os.environ["TEST_SHARD"])
          count = int(os.environ["TEST_SHARD_COUNT"])
          files = sorted(Path("tests").glob("test_*.py"))
          selected = [str(path) for index, path in enumerate(files) if index % count == shard]
          if not selected:
              raise SystemExit("empty test shard")
          print("\n".join(selected))
          PY
          )
          printf 'shard=%s files=%s\n' "$TEST_SHARD" "${#test_files[@]}"
          printf '%s\n' "${test_files[@]}"
          python -m pytest "${test_files[@]}" -q --tb=short -x
