name: TradingDatas CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 02:17 Asia/Shanghai: full canary/timing coverage, isolated from PR latency.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Run the PR-fast suite or the nightly-equivalent full suite
        required: true
        default: pr
        type: choice
        options:
          - pr
          - full
      docs_fast_path:
        description: Allow reviewed prose-only exact-main verification without release artifacts
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Exact main commit SHA to validate when dispatching a post-merge run
        required: false
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  DOCS_FAST_PATH: ${{ inputs.docs_fast_path || false }}

concurrency:
  group: tradingdatas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_fast:
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    name: PR fast tests (shard ${{ matrix.shard_id }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard_id: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Classify documentation changes
        id: changes
        run: python3 .github/scripts/docs_fast_path.py

      - name: Set up Python
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m compileall -q .

      - name: Run fast test shard
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          started_at="$(date +%s)"
          python -m pytest tests/ -q --tb=short -m "not slow" -n auto --dist=loadfile \
            --shard-id=${{ matrix.shard_id }} --num-shards=4
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          printf 'fast_shard=%s/4\nelapsed_seconds=%s\n' \
            "${{ matrix.shard_id }}" "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

  nightly_full:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    name: Nightly full tests (shard ${{ matrix.shard_id }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard_id: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run full test shard
        run: |
          started_at="$(date +%s)"
          python -m pytest tests/ -q --tb=short -n auto --dist=loadfile \
            --ignore=tests/test_v1_api.py \
            --shard-id=${{ matrix.shard_id }} --num-shards=4
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          printf 'full_shard=%s/4\nelapsed_seconds=%s\n' \
            "${{ matrix.shard_id }}" "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

  nightly_http_timing:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    name: Nightly local HTTP timing tests (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run local HTTP timing tests serially
        run: |
          started_at="$(date +%s)"
          python -m pytest tests/test_v1_api.py -q --tb=short
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          printf 'nightly_http_timing=serial\nelapsed_seconds=%s\n' \
            "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"
