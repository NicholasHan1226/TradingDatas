name: Automerge Trusted Agent PRs

on:
  workflow_run:
    workflows:
      - TradingDatas CI
    types:
      - completed
  pull_request_target:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write

env:
  TRUSTED_PR_AUTHOR: NicholasHan1226
  CONTROLLER_ACCEPT_LABEL: controller-accepted
  M0_AUTOMERGE_LABEL: automerge-m0

jobs:
  merge:
    # CI path: TradingDatas CI just completed successfully on a PR head.
    # Label path: the controller-accepted label was just applied and the CI
    # state for that exact head is re-verified below. Either order results in
    # a merge; concurrent attempts are tolerated. Issue #228: a green CI run
    # is evidence only, never merge authority, so both triggers additionally
    # require the Controller-applied acceptance label.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'pull_request_target'
        && (github.event.label.name == 'controller-accepted'
          || github.event.label.name == 'automerge-m0'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge controller-accepted trusted PR
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_PRS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          LABEL_EVENT_PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            PR_NUMBER="$(jq -r '.[0].number // empty' <<<"$WORKFLOW_PRS_JSON")"
            if [[ -z "$PR_NUMBER" ]]; then
              echo "No pull request is associated with this successful workflow run."
              exit 0
            fi
          else
            PR_NUMBER="$LABEL_EVENT_PR_NUMBER"
          fi

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          AUTHOR="$(jq -r '.user.login' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"

          [[ "$STATE" == "open" ]] || { echo "Skip: PR #${PR_NUMBER} is not open."; exit 0; }
          [[ "$BASE_REF" == "main" ]] || { echo "Skip: PR base is not main."; exit 0; }
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || { echo "Skip: fork PRs never auto-merge."; exit 0; }
          [[ "$AUTHOR" == "$TRUSTED_PR_AUTHOR" ]] || { echo "Skip: PR author is not a trusted member."; exit 0; }
          [[ "$DRAFT" == "false" ]] || { echo "Skip: PR is still a draft."; exit 0; }

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # The CI conclusion that triggered this run belongs to this exact
            # head; refuse to act when the PR has moved on in the meantime.
            [[ "$HEAD_SHA" == "$RUN_HEAD_SHA" ]] || { echo "Skip: tested SHA ${RUN_HEAD_SHA:0:8} no longer matches PR head ${HEAD_SHA:0:8}."; exit 0; }
          fi

          # A label selects exactly one merge class. M0 is limited to a
          # machine-readable declaration and a narrow reversible path allowlist;
          # every other class remains SHA-bound Controller M1 acceptance.
          LABEL_NAMES="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          HAS_M0=false
          HAS_CONTROLLER=false
          grep -qx "$M0_AUTOMERGE_LABEL" <<<"$LABEL_NAMES" && HAS_M0=true || true
          grep -qx "$CONTROLLER_ACCEPT_LABEL" <<<"$LABEL_NAMES" && HAS_CONTROLLER=true || true
          if [[ "$HAS_M0" == true && "$HAS_CONTROLLER" == true ]]; then
            echo "Skip: PR #${PR_NUMBER} has conflicting M0 and Controller labels."
            exit 0
          fi
          if [[ "$HAS_M0" == true ]]; then
            M0_ACTOR="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
              --jq '[.[] | select(.event == "labeled" and .label.name == "automerge-m0")] | sort_by(.created_at) | last | .actor.login // empty')"
            [[ "$M0_ACTOR" == "$TRUSTED_PR_AUTHOR" ]] || { echo "Skip: untrusted M0 label actor."; exit 0; }
            PR_BODY="$(jq -r '.body // ""' <<<"$PR_JSON")"
            grep -qx 'change_class=M0' <<<"$PR_BODY" || { echo "Skip: M0 body declaration missing."; exit 0; }
            grep -qx "candidate=$HEAD_SHA" <<<"$PR_BODY" || { echo "Skip: M0 candidate is not the current head."; exit 0; }
            CHANGED_FILES="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
            grep -Eqv '^(README\.md|CONTRIBUTING\.md|docs/|tests/|static/)' <<<"$CHANGED_FILES" && { echo "Skip: M0 changed a non-allowlisted path."; exit 0; }
          elif [[ "$HAS_CONTROLLER" == true ]]; then
            LABEL_ACTOR="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
              --jq '[.[] | select(.event == "labeled" and .label.name == "controller-accepted")] | sort_by(.created_at) | last | .actor.login // empty')"
            [[ "$LABEL_ACTOR" == "$TRUSTED_PR_AUTHOR" ]] || { echo "Skip: Controller label actor is untrusted."; exit 0; }
            ACCEPTANCE_CANDIDATE="$(
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
                --jq '[.[] | select(.user.login == "NicholasHan1226") | select(.body | contains("AUTODEV_RETURN_V1") and contains("decision=accepted"))] | sort_by(.created_at) | last | .body // ""' \
                | sed -nE 's/^candidate=([0-9a-f]{40})$/\1/p'
            )"
            [[ "$ACCEPTANCE_CANDIDATE" == "$HEAD_SHA" ]] || { echo "Skip: Controller return does not accept current head."; exit 0; }
          else
            echo "CI green but no accepted M0 or Controller M1 label is present."
            exit 0
          fi

          CHANGED_FILES="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<<"$CHANGED_FILES"; then
            echo "Skip: workflow-governance changes require a separate trusted bootstrap merge."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            # Label path: the CI state for this head is not implied by the
            # trigger. Require the TradingDatas CI run for this exact head to
            # have completed successfully; otherwise the workflow_run trigger
            # retries the merge once CI finishes.
            RUNS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"
            CI_STATUS="$(jq -r '[.workflow_runs[] | select(.name == "TradingDatas CI")] | .[0] | .status // "none"' <<<"$RUNS_JSON")"
            CI_CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "TradingDatas CI")] | .[0] | .conclusion // "none"' <<<"$RUNS_JSON")"
            if [[ "$CI_STATUS" != "completed" || "$CI_CONCLUSION" != "success" ]]; then
              echo "TradingDatas CI on head ${HEAD_SHA:0:8} is ${CI_STATUS}/${CI_CONCLUSION}; merge will be retried when CI completes."
              exit 0
            fi
          fi

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$HAS_M0" != true && "$BASE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo "M1 base advanced; do not mutate the candidate branch. The owner or Controller must refresh the PR, rerun CI, and record a new exact-head acceptance."
            exit 0
          fi
          if [[ "$HAS_M0" == true && "$BASE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo "M0 base advanced. The exact tested head and narrow path allowlist remain sufficient only when GitHub still reports the PR mergeable; continue without rewriting the candidate branch."
          fi

          # Branch protection requires GitHub's merge queue/auto-merge path.
          # Keep this SHA- and Controller-bound; --auto waits for the same
          # required checks instead of bypassing them.
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --auto; then
            # --auto can return before GitHub actually merges.  Do not use the
            # prospective test-merge SHA from an open PR: wait for the actual
            # closed/merged record before dispatching post-merge verification.
            for _ in {1..20}; do
              PR_AFTER="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
              STATE_AFTER="$(jq -r '.state' <<<"$PR_AFTER")"
              MERGED_AT="$(jq -r '.merged_at // empty' <<<"$PR_AFTER")"
              MERGE_SHA="$(jq -r '.merge_commit_sha // empty' <<<"$PR_AFTER")"
              if [[ "$STATE_AFTER" == "closed" && -n "$MERGED_AT" ]]; then
                [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
                CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                [[ "$MERGE_SHA" == "$CURRENT_MAIN_SHA" ]] || {
                  echo "Main advanced after merge; skip stale exact-main dispatch for ${MERGE_SHA:0:8}."
                  exit 0
                }
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
                  -f ref=main \
                  -f 'inputs[suite]=pr' \
                  -f "inputs[expected_sha]=$MERGE_SHA"
                if grep -q '^static/' <<<"$CHANGED_FILES"; then
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
                    -f ref=main \
                    -f "inputs[expected_sha]=$MERGE_SHA"
                fi
                echo "Merged PR #${PR_NUMBER} (head ${HEAD_SHA:0:8}); dispatched exact-main CI for ${MERGE_SHA:0:8}, plus static deploy when applicable. Controller must separately verify server source, immutable release, and runtime."
                exit 0
              fi
              sleep 3
            done
            echo "Auto-merge is enabled for PR #${PR_NUMBER}; it has not merged within this bounded wait, so no post-merge workflow was dispatched."
            exit 0
          else
            PR_STATE_AFTER="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
            if [[ "$PR_STATE_AFTER" != "open" ]]; then
              echo "PR #${PR_NUMBER} was already merged by a concurrent run."
              exit 0
            fi
            echo "Merge command failed for PR #${PR_NUMBER}."
            exit 1
          fi
