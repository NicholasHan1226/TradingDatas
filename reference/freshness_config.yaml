# SharedSignals per-data-source freshness thresholds (hours).
# When a source is not listed, reader._freshness() falls back to
# the caller-supplied stale_after_hours parameter.
#
# Tiers:
#   realtime   — sub-hour freshness for live feeds
#   daily_eod  — T+1 plus buffer for A-share daily data
#   events     — news / sentiment / event candidates
#   financial  — quarterly / annual financial statements
#   macro      — macro-economic indicators
#   reference  — static reference data (symbol master, calendar, etc.)

sources:
  # A-share daily market data (T+1 plus buffer)
  a_share_daily:
    stale_after_hours: 24
  tushare:sqlite:market_bars_daily:
    stale_after_hours: 24

  # Crypto — real-time
  crypto:
    stale_after_hours: 1
  binance:
    stale_after_hours: 1
  sqlite:market_crypto_klines:
    stale_after_hours: 1

  # Polymarket prediction markets
  polymarket:
    stale_after_hours: 2
  sqlite:market_pm_markets:
    stale_after_hours: 2
  sqlite:market_pm_prices:
    stale_after_hours: 2

  # Events / sentiment
  sqlite:market_events:
    stale_after_hours: 6
  sqlite:market_sentiment:
    stale_after_hours: 6

  # Financial statements (weekly threshold)
  tushare:fina_indicator:
    stale_after_hours: 168
  sqlite:market_factors:
    stale_after_hours: 168
  income:
    stale_after_hours: 168
  balancesheet:
    stale_after_hours: 168
  cashflow:
    stale_after_hours: 168

  # Macro
  sqlite:macro_factors:
    stale_after_hours: 48
  sqlite:all_weather_regime:
    stale_after_hours: 48

  # Moneyflow / trading (T+1)
  sqlite:moneyflow:
    stale_after_hours: 24

  # Reference — essentially permanent
  sqlite:reference:
    stale_after_hours: 8760   # 1 year as sentinel; stale_after is irrelevant for reference
  reference:market_calendar:
    stale_after_hours: 24     # calendar cached but refreshed daily

  # Realtime 5-min data
  sqlite:market_bars_intraday:
    stale_after_hours: 1

# Fallback default when source_id not matched in sources map.
fallback_default_hours: 24
