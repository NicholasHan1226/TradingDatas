# SharedSignals Tushare collector — 6-tier priority config
# ZERO on-demand. ALL frequencies are explicit (5min or daily).
# Placeholders: {ts_code}, {start_date}, {end_date}, {trade_date}
#
# Tier        | Freq      | Schedule        | Purpose
# P0_trading  | 5min      | */5 9-15 1-5    | Live trading data (行情/资金流/因子/分钟)
# P1_eod      | daily     | 35 16 * * 1-5   | EOD after close (basic/adj/margin/limit)
# P2_financial| daily     | 30 18 * * 1-5   | Financial statements (after Tushare update)
# P3_reference| daily     | 15 6 * * *      | Reference/master data (before market)
# P4_macro    | daily     | 45 8 * * *      | Macro/economic indicators (morning)
# P5_hk_us    | daily     | 15 7 * * *      | HK/US market data
# P6_other    | daily     | 30 17 * * *     | Futures/funds/ETF/convertible/news

priorities:
  # ── P0: Live trading data — 5-min during market hours ──
  P0_trading_5min:
    - api_name: daily
      frequency: 5min
      per_stock: true
      params:
        ts_code: "{ts_code}"
        start_date: "{start_date}"
        end_date: "{end_date}"
      fields: "ts_code,trade_date,open,high,low,close,pre_close,change,pct_chg,vol,amount"

    - api_name: moneyflow
      frequency: 5min
      per_stock: true
      params:
        ts_code: "{ts_code}"
        trade_date: "{trade_date}"

    - api_name: stk_factor
      frequency: 5min
      per_stock: true
      params:
        ts_code: "{ts_code}"
        start_date: "{start_date}"
        end_date: "{end_date}"

    - api_name: index_daily
      frequency: 5min
      per_stock: true
      params:
        ts_code: "{ts_code}"
        start_date: "{start_date}"
        end_date: "{end_date}"

    - api_name: fund_daily
      frequency: 5min
      per_stock: true
      params:
        ts_code: "{ts_code}"
        start_date: "{start_date}"
        end_date: "{end_date}"

    - api_name: stk_mins
      frequency: 5min
      per_stock: true
      params:
        ts_code: "{ts_code}"
        trade_date: "{trade_date}"
        freq: "5min"

    - api_name: rt_k
      frequency: 5min
      per_stock: true
      params:
        ts_code: "{ts_code}"

  # ── P1: EOD data — daily at 16:35 after close ──
  P1_eod_daily:
