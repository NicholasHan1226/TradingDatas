        trade_date: "{trade_date}"

    - api_name: stk_limit
      frequency: daily
      per_stock: true
      params:
        ts_code: "{ts_code}"
        trade_date: "{trade_date}"
        start_date: "{start_date}"
        end_date: "{end_date}"

  # ── P2: Financial statements — daily at 18:30 after Tushare update ──
  P2_financial_daily:
