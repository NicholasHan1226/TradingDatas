# Binance Crypto Collector Configuration
# Default USDT pairs and intervals

symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - XRPUSDT
  - DOGEUSDT
  - ADAUSDT
  - AVAXUSDT
  - LINKUSDT

intervals:
  - 1d      # daily bars
  - 4h      # 4-hour bars
  - 1h      # hourly bars
  - 15m     # 15-min bars

# Binance API limits:
#   Weight: 1200/min
#   Raw requests: 1200/min
#   Order book: 50 weight
rate_limit:
  weight_per_min: 1200
  kline_weight: 2       # GET /api/v3/klines weight per call (up to 500 klines)
  ticker_weight: 4      # GET /api/v3/ticker/24hr weight per call (up to symbols limit)

# Retry settings
retry:
  max_attempts: 3
  base_delay_sec: 1.0
  max_delay_sec: 30.0

# Proxy (optional)
proxy: ""

# Dry-run mode: log but don't write to storage
dry_run: false
