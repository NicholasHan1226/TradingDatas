# Polymarket Collector Configuration

# CLOB API base URL
api_base: "https://clob.polymarket.com"

# Gamma Markets API (for market listings)
gamma_api: "https://gamma-api.polymarket.com"

# Collection settings
collection:
  markets_interval_min: 30
  prices_interval_min: 10
  active_only: true
  max_markets_per_fetch: 500

# Tags to filter (empty = all)
tags: []

# Rate limiting
rate_limit:
  requests_per_sec: 5
  burst: 10

# Retry
retry:
  max_attempts: 3
  base_delay_sec: 1.0

# Parquet loader
parquet:
  input_dir: ""
  glob_pattern: "*.parquet"
