- api_name: idx_mins
  doc_url: https://tushare.pro/wctapi/documents/419.md
  doc_sha256: 3b53fa880171c36a9e3bdad2a6c3fdb37e24bb199f9dd852356cc9252d11939e
  title: 指数历史分钟
  category: 指数专题
  description: 获取交易所指数分钟数据，支持1min/5min/15min/30min/60min行情，提供Python SDK和 http Restful API两种方式
  notes:
  - 接口：idx_mins
  - 描述：获取交易所指数分钟数据，支持1min/5min/15min/30min/60min行情，提供Python SDK和 http Restful API两种方式
  input_fields:
  - name: ts_code
    declared_type: str
    description: 指数代码，e.g. 000001.SH
    required: Y
  - name: freq
    declared_type: str
    description: 分钟频度（1min/5min/15min/30min/60min）
    required: Y
  - name: start_date
    declared_type: datetime
    description: 开始日期 格式：2023-08-25 09:00:00
    required: N
  - name: end_date
    declared_type: datetime
    description: 结束时间 格式：2023-08-25 19:00:00
    required: N
  output_fields:
  - name: ts_code
    declared_type: str
    description: 指数代码
    default_display: Y
  - name: trade_time
    declared_type: str
    description: 交易时间
    default_display: Y
  - name: open
    declared_type: float
    description: 开盘价
    default_display: Y
  - name: close
    declared_type: float
    description: 收盘价
    default_display: Y
  - name: high
    declared_type: float
    description: 最高价
    default_display: Y
  - name: low
    declared_type: float
    description: 最低价
    default_display: Y
  - name: vol
    declared_type: int
    description: 成交量(股)
    default_display: Y
  - name: amount
    declared_type: float
    description: 成交金额（元）
    default_display: Y
