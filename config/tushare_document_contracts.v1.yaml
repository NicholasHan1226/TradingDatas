  description: 获取上市公司财务指标数据，为避免服务器压力，现阶段每次请求最多返回100条记录，可通过设置日期多次请求获取更多数据。
  notes:
  - 接口：fina_indicator，可以通过[**数据工具**](https://tushare.pro/webclient/)调试和查看数据。
  - 描述：获取上市公司财务指标数据，为避免服务器压力，现阶段每次请求最多返回100条记录，可通过设置日期多次请求获取更多数据。
