- api_name: stk_nineturn
  doc_url: https://tushare.pro/wctapi/documents/364.md
  doc_sha256: dc1287b181008179f33136a93f508fb7530316665247fc54173874a093c81233
  title: 神奇九转指标
  category: 股票数据,特色数据
  description: 神奇九转（又称“九转序列”）是一种基于技术分析的股票趋势反转指标，其思想来源于技术分析大师汤姆·迪马克（Tom DeMark）的TD序列。该指标的核心功能是通过识别股价在上涨或下跌过程中连续9天的特定走势，来判断股价的潜在反转点，从而帮助投资者提高抄底和逃顶的成功率，日线级别配合60min的九转效果更好，数据从20230101开始。
  notes:
  - 接口：stk_nineturn（由于涉及分钟数据每天21点更新）
  - 描述：神奇九转（又称“九转序列”）是一种基于技术分析的股票趋势反转指标，其思想来源于技术分析大师汤姆·迪马克（Tom DeMark）的TD序列。该指标的核心功能是通过识别股价在上涨或下跌过程中连续9天的特定走势，来判断股价的潜在反转点，从而帮助投资者提高抄底和逃顶的成功率，日线级别配合60min的九转效果更好，数据从20230101开始。
  input_fields:
  - name: ts_code
    declared_type: str
    description: 股票代码
    required: N
  - name: trade_date
    declared_type: str
    description: 交易日期 （格式：YYYY-MM-DD HH:MM:SS)
    required: N
  - name: freq
    declared_type: str
    description: 频率(日daily)
    required: N
  - name: start_date
    declared_type: str
    description: 开始时间
    required: N
  - name: end_date
    declared_type: str
    description: 结束时间
    required: N
  output_fields:
  - name: ts_code
    declared_type: str
    description: 股票代码
    default_display: Y
  - name: trade_date
    declared_type: datetime
    description: 交易日期
    default_display: Y
  - name: freq
    declared_type: str
    description: 频率(日daily)
    default_display: Y
  - name: open
    declared_type: float
    description: 开盘价
    default_display: Y
  - name: high
    declared_type: float
    description: 最高价
    default_display: Y
  - name: low
    declared_type: float
    description: 最低价
    default_display: Y
  - name: close
    declared_type: float
    description: 收盘价
    default_display: Y
  - name: vol
    declared_type: float
    description: 成交量
