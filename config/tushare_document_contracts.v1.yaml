- api_name: adj_factor
  doc_url: https://tushare.pro/wctapi/documents/28.md
  doc_sha256: e8ce97d2e7f3998d2c564235e8c696edf1973dac7bd1a3fa878ce6dbd6ee2f35
  title: 复权因子
  category: 股票数据,行情数据
  description: 本接口由Tushare自行生产，获取股票复权因子，可提取单只股票全部历史复权因子，也可以提取单日全部股票的复权因子。
  notes:
  - 接口：adj_factor，可以通过[**数据工具**](https://tushare.pro/webclient/)调试和查看数据。
  - 更新时间：盘前9点15~20分完成当日复权因子入库
  - 描述：本接口由Tushare自行生产，获取股票复权因子，可提取单只股票全部历史复权因子，也可以提取单日全部股票的复权因子。
  input_fields:
  - name: ts_code
    declared_type: str
    description: 股票代码
    required: N
  - name: trade_date
    declared_type: str
    description: 交易日期(YYYYMMDD，下同)
    required: N
  - name: start_date
    declared_type: str
    description: 开始日期
    required: N
  - name: end_date
    declared_type: str
    description: 结束日期
    required: N
  output_fields:
  - name: ts_code
    declared_type: str
    description: 股票代码
    default_display: ''
  - name: trade_date
    declared_type: str
    description: 交易日期
    default_display: ''
  - name: adj_factor
    declared_type: float
    description: 复权因子
    default_display: ''
