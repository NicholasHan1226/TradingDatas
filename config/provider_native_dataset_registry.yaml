version: 1
query_defaults:
  max_request_bytes: 65536
  max_response_bytes: 4194304
  max_page_size: 500
  max_lookback_days: 36500
  max_selected_fields: 100
  max_filter_terms: 16
  max_in_values: 100
  max_order_terms: 8
  max_catalog_search_chars: 128
  cursor_ttl_seconds: 900
  sqlite_progress_steps: 1000000
datasets:
- dataset_id: cn.market.trade_calendar
  aliases:
  - tushare.trade_cal
  domain: market_data
  market: CN
  entity_type: trade_calendar
  data_classification: objective_factual
  schema_version: 2.0.0
  cadence_class: daily_reference
  timezone: Asia/Shanghai
  freshness_sla_seconds: 604800
  provider_bindings:
  - provider: tushare
    api_name: trade_cal
    adapter_version: tushare-provider-native.v1
    read_discriminator_value: tushare_trade_cal
    entitlement_state: unknown
    activation_state: paused
    target_tables:
    - provider_dataset_rows
    request_template:
      end_date: ${window.end_date}
      exchange: SSE
      start_date: ${window.start_date}
    request_window_policy:
      required_keys:
      - start_date
      - end_date
      formats:
        end_date: yyyymmdd
        start_date: yyyymmdd
      range_start_key: start_date
      range_end_key: end_date
      max_span_days: 366
    response_completeness:
      strategy: one_row_per_calendar_date
      date_field: cal_date
      request_start_key: start_date
      request_end_key: end_date
      fixed_field_matches:
        exchange: exchange
    requested_fields: []
    max_batch_bytes: 4194304
    max_nesting_depth: 16
    max_payload_bytes_per_row: 65536
    max_rows_per_attempt: 1000
  read_model_adapter:
    adapter_version: provider-native-json.v1
    primary_table: provider_dataset_rows
    fixed_field_filters: []
    storage_kind: provider_native_rows
    row_key_strategy: primary_key
  fields:
  - name: exchange
    logical_type: text
    nullable: false
    selectable: true
    filterable: true
    sortable: true
  - name: cal_date
    logical_type: text
    nullable: false
    selectable: true
    filterable: true
    sortable: true
  - name: is_open
    logical_type: integer
    nullable: false
    selectable: true
    filterable: true
    sortable: true
  - name: pretrade_date
    logical_type: text
    nullable: true
    selectable: true
    filterable: true
    sortable: true
  primary_key:
  - exchange
  - cal_date
  default_projection:
  - exchange
  - cal_date
  - is_open
  - pretrade_date
  as_of_field: cal_date
  as_of_format: yyyymmdd
  range_field: cal_date
  partition_field: cal_date
  point_in_time: current_snapshot
  backfill_policy: provider_limited
  empty_data_policy: forbidden
  required_scope: market_data
  quota_class: beta_standard
