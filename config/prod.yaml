# SharedSignals Production Configuration
# All sources, full frequency, production database

environment: prod
server: ${SHAREDSIGNALS_SERVER:-8.138.181.177}
secondary_server: ${SHAREDSIGNALS_SECONDARY_SERVER:-47.82.153.58}  # Singapore proxy relay (Polymarket/Crypto); RSS/RSSHub retired

# ---- Database ----
database:
  marketdata: "/opt/investment/SharedSignals/runtime/read_model/marketdata.sqlite"
  duckdb: "/opt/investment/SharedSignals/data/marketdata.duckdb"
  max_size_mb: 500

# ---- Collectors ----
collectors:
  enabled:
    - tushare_full      # A-share/Futures/HK/US/Macro/Funds: P0-P7 tiers from collectors/tushare/config.yaml
    - binance_full      # Crypto: 9 symbols; ticker every 30min, daily-bar support every 6h
    - polymarket_full   # Prediction Markets: all tags

  tushare:
    enabled: true
    symbols: "all"
    config_source: "collectors/tushare/config.yaml"
    tiers: ["P0_trading_5min", "P1_eod_daily", "P2_financial_daily", "P3_reference_daily", "P4_macro_daily", "P5_hk_us_daily", "P6_other_daily", "P7_low_frequency"]
    frequency: "5min"     # A-share intraday tier only
    postclose_frequency: "daily"

  binance:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT",
              "XRPUSDT", "ADAUSDT", "DOGEUSDT", "AVAXUSDT", "LINKUSDT"]
    intervals: ["1d"]
    frequency: "30min"
    daily_bar_frequency: "6h"
    proxy: "http://127.0.0.1:7890"

  polymarket:
    enabled: true
    tags: ["politics", "crypto", "sports", "technology", "world",
           "science", "economics", "entertainment", "business", "health"]
    frequency: "30min"
    proxy: "http://127.0.0.1:7890"

  retired_or_deferred_sources:
    rss_rsshub: "retired; rebuild as a SharedSignals direct-DB event collector before any production use"
    tavily: "deferred; no production collector or cron"
    deepseek: "deferred; no production collector or cron"

# ---- Runtime ----
runtime:
  root: "/opt/investment/SharedSignals/runtime"
  archive_dir: "/opt/investment/SharedSignals/runtime/archive"
  rejected_dir: "/opt/investment/SharedSignals/runtime/rejected"
  duckdb_sync_script: "storage/duckdb_merge.py"

# ---- Health ----
health:
  patrol_interval_minutes: 10
  freshness_max_age_hours: 2
  dedup_enabled: true
  dedup_url_normalize: true
  quality_checks: true
  quality_min_score: 0.6
  source_health_threshold:
    healthy: 0.95
    intermittent: 0.70
  fallback_sources:
    enabled: false

# ---- Backfill ----
backfill:
  max_days_lookback: 365
  batch_size_symbols: 50
  rate_limit_seconds: 0.2

# ---- Notifications ----
notifications:
  enabled: true
  email:
    system: "notice@tradingagent.cc"
    trading: "notice@tradingagent.cc"
  lark:
    enabled: false

# ---- Logging ----
logging:
  level: "INFO"
  file: "/opt/investment/SharedSignals/logs/sharedsignals.log"
  max_size_mb: 50
  backup_count: 5
  format: "json"
