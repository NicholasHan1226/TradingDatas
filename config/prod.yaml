# SharedSignals Production Configuration
# All sources, full frequency, production database

environment: prod
server: ${SHAREDSIGNALS_SERVER:-8.138.181.177}
secondary_server: ${SHAREDSIGNALS_SECONDARY_SERVER:-47.82.153.58}  # Singapore RSS mirror

# ---- Database ----
database:
  marketdata: "/opt/investment/SharedSignals/runtime/read_model/marketdata.sqlite"
  duckdb: "/opt/investment/SharedSignals/data/marketdata.duckdb"
  max_size_mb: 500

# ---- Collectors ----
collectors:
  enabled:
    - tushare_full      # A-share: P0-P6 tiers from collectors/tushare/config.yaml
    - binance_full      # Crypto: 9 symbols; ticker every 5min, klines on demand
    - polymarket_full   # Prediction Markets: all tags
    # RSS/RSSHub is deferred. Legacy assets remain on disk for migration audit,
    # but current production cron must not treat them as live collectors.

  tushare:
    enabled: true
    symbols: "all"
    config_source: "collectors/tushare/config.yaml"
    tiers: ["P0_trading_5min", "P1_eod_daily", "P2_financial_daily", "P3_reference_daily", "P4_macro_daily", "P5_hk_us_daily", "P6_other_daily"]
    frequency: "5min"     # intraday
    postclose_frequency: "daily"

  binance:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT",
              "XRPUSDT", "ADAUSDT", "DOGEUSDT", "AVAXUSDT", "LINKUSDT"]
    intervals: ["1d", "4h", "1h", "5m", "15m"]
    frequency: "5min"
    proxy: "http://127.0.0.1:7890"

  polymarket:
    enabled: true
    tags: ["politics", "crypto", "sports", "technology", "world",
           "science", "economics", "entertainment", "business", "health"]
    frequency: "5min"
    proxy: "http://127.0.0.1:7890"

  rss:
    enabled: false
    status: "retired"
    note: "Historical RSSHub/RSSCollector assets are archived; do not restore as production collectors. Rebuild as a new SharedSignals collector that writes directly to the read model."
    proxy: "http://127.0.0.1:7890"
    max_retries: 4
    timeout_seconds: 30

  tavily:
    enabled: false
    frequency: "15min"
    max_queries_per_run: 100

  deepseek:
    enabled: false
    frequency: "15min"
    max_tokens_per_run: 50000

# ---- Runtime ----
runtime:
  root: "/opt/investment/SharedSignals/runtime"
  archive_dir: "/opt/investment/SharedSignals/runtime/archive"
  rejected_dir: "/opt/investment/SharedSignals/runtime/rejected"
  duckdb_sync_script: "storage/duckdb_merge.py"

# ---- Health ----
health:
  patrol_interval_minutes: 10
  freshness_max_age_hours: 2
  dedup_enabled: true
  dedup_url_normalize: true
  quality_checks: true
  quality_min_score: 0.6
  source_health_threshold:
    healthy: 0.95
    intermittent: 0.70
  fallback_sources:
    enabled: false

# ---- Backfill ----
backfill:
  max_days_lookback: 365
  batch_size_symbols: 50
  rate_limit_seconds: 0.2

# ---- Notifications ----
notifications:
  enabled: true
  email:
    system: "notice@tradingagent.cc"
    trading: "notice@tradingagent.cc"
  lark:
    enabled: false

# ---- Logging ----
logging:
  level: "INFO"
  file: "/opt/investment/SharedSignals/logs/sharedsignals.log"
  max_size_mb: 50
  backup_count: 5
  format: "json"
