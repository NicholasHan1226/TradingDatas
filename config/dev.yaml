# SharedSignals Development Configuration
# Few sources, low frequency, test database

environment: dev
server: ${SHAREDSIGNALS_SERVER:-127.0.0.1}

# ---- Database ----
database:
  marketdata: "/tmp/sharedsignals_dev_marketdata.sqlite"

# ---- Collectors ----
collectors:
  enabled:
    - tushare_sample    # A-share: 2 stocks only
    - binance_sample    # Crypto: BTC/ETH only
    - polymarket_sample # Prediction Markets: 2 tags

  tushare:
    enabled: true
    symbols: ["000001.SZ", "600519.SH"]
    interfaces: ["daily", "moneyflow"]
    frequency: "manual"  # manual trigger only in dev

  binance:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT"]
    intervals: ["1d"]
    frequency: "manual"

  polymarket:
    enabled: true
    tags: ["crypto", "politics"]
    frequency: "manual"

# ---- Health ----
health:
  patrol_interval_minutes: 0   # manual
  freshness_max_age_hours: 24
  dedup_enabled: true
  quality_checks: true

# ---- Logging ----
logging:
  level: "DEBUG"
  file: "/tmp/sharedsignals_dev.log"
  format: "json"
