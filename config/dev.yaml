# SharedSignals Development Configuration
# Few sources, low frequency, test database

environment: dev
server: ${SHAREDSIGNALS_SERVER:-127.0.0.1}

# ---- Database ----
database:
  marketdata: "/tmp/sharedsignals_dev_marketdata.sqlite"
  reference_index: "/tmp/sharedsignals_dev_reference.sqlite"
  rss_collector: "/tmp/sharedsignals_dev_rss.db"

# ---- Collectors ----
collectors:
  enabled:
    - tushare_sample    # A-share: 2 stocks only
    - binance_sample    # Crypto: BTC/ETH only
    - polymarket_sample # Prediction Markets: 2 tags
    - rss_sample        # RSS: 5 feeds

  tushare:
    enabled: true
    symbols: ["000001.SZ", "600519.SH"]
    interfaces: ["daily", "moneyflow"]
    frequency: "manual"  # manual trigger only in dev

  binance:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT"]
    intervals: ["1d"]
    frequency: "manual"

  polymarket:
    enabled: true
    tags: ["crypto", "politics"]
    frequency: "manual"

  rss:
    enabled: true
    feeds:
      - name: "reuters_top"
        url: "https://feeds.reuters.com/reuters/topNews"
        category: "news"
        interval_minutes: 60
      - name: "coindesk"
        url: "https://feeds.coindesk.com/coindesk"
        category: "crypto"
        interval_minutes: 60
    fallback_enabled: true

# ---- Staging ----
staging:
  root: "/tmp/sharedsignals_dev_staging"
  streams:
    - event_candidates
    - sentiment_signals
    - collection_runs
  max_file_age_minutes: 5

# ---- Health ----
health:
  patrol_interval_minutes: 0   # manual
  freshness_max_age_hours: 24
  dedup_enabled: true
  quality_checks: true

# ---- Logging ----
logging:
  level: "DEBUG"
  file: "/tmp/sharedsignals_dev.log"
  format: "json"
