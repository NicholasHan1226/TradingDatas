version: "2026-07-09"
status: planned_only
rule: "Horizontal expansion candidates are not production collectors until direct SQLite writes, API visibility, freshness SLA, rate limits, degraded behavior, and tests are implemented."
activation_policy:
  default_mode: planned
  pilot_before_scheduled: true
  no_5min_without_hot_path_proof: true
  no_provider_or_file_fallback: true
  required_gate:
    - docs/data_source_onboarding.md
    - docs/market_capability_matrix.md
    - source_status_green_after_pilot
    - health_sla_rule
    - capability_or_source_specific_tests
priority_batches:
  - batch: B1_event_risk_official_sources
    objective: "Improve event and disclosure coverage without generating trade decisions."
    promotion_window: "pilot first; 1-2 trading days observation before scheduled mode"
    candidates:
      - source_id: official_exchange_announcements_cn
        provider: official_exchange_disclosure
        market: Ashare
        module: event_news_announcements_reports
        api_name_or_dataset: exchange_company_announcements
        activation_mode: planned
        cadence_class: event_lane_10_30min_pilot
        freshness_sla: "10-30 minutes during disclosure windows after provider verification"
        target_tables:
          - market_events
        write_path: collectors/events/official_exchange_announcements.py
        rate_limit: "single-flight per exchange; provider robots/terms verification required before implementation"
        degraded_behavior: "empty/stale/provider_error returns degraded event rows or source_status yellow/red; never calls provider from API readers"
        http_surface:
          - /events
          - /sentiment
          - /tushare
        owner_consumer:
          - TradingAgent
          - MarketGraph
          - external_agent
        expected_write_cost: "medium during disclosure windows; dedup required by event_hash"
        priority: P1
        production_ready: false
      - source_id: sec_edgar_filings
        provider: SEC EDGAR
        market: US
        module: event_filings_fundamentals
        api_name_or_dataset: company_filings_and_facts
        activation_mode: planned
        implementation_status: manual_pilot_collector_available
        latest_pilot_evidence: "2026-07-09: production manual pilot wrote 6 filing metadata rows for CIK0000320193 and CIK0000789019 to market_events; /events returned sec_edgar rows; not scheduled."
        cadence_class: event_lane_30_60min_pilot
        freshness_sla: "30-60 minutes for filings; daily for company facts"
        target_tables:
          - market_events
          - market_factors
        write_path: collectors/events/sec_edgar_filings.py
        rate_limit: "SEC fair-access rate guard required before implementation"
        degraded_behavior: "provider_error/timeout/stale returns degraded; no API-side fallback"
        http_surface:
          - /events
          - /fundamentals
          - /tushare
        owner_consumer:
          - TradingAgent
          - MarketGraph
          - external_agent
        expected_write_cost: "medium; filing metadata first, company facts after pilot"
        priority: P1
        production_ready: false
  - batch: B2_macro_official_sources
    objective: "Add official macro/rates redundancy at low write cost."
    promotion_window: "daily pilot; 2 successful refreshes before scheduled mode"
    candidates:
      - source_id: fred_macro_rates
        provider: FRED
        market: Global
        module: macro_rates_fx
        api_name_or_dataset: macro_rates_series
        activation_mode: planned
        cadence_class: daily_or_low_frequency_pilot
        freshness_sla: "daily or provider release schedule"
        target_tables:
          - market_factors
        write_path: collectors/macro/fred_macro_rates.py
        rate_limit: "daily batch with configured series allowlist"
        degraded_behavior: "series unavailable or stale is degraded by series, not fatal to price feeds"
        http_surface:
          - /macro
          - /tushare
        owner_consumer:
          - MarketGraph
          - TradingAgent
          - external_agent
        expected_write_cost: "low"
        priority: P2
        production_ready: false
      - source_id: treasury_yield_curve
        provider: official_treasury
        market: US
        module: macro_rates_fx
        api_name_or_dataset: treasury_yield_curve
        activation_mode: planned
        cadence_class: daily_or_low_frequency_pilot
        freshness_sla: "daily after publication window"
        target_tables:
          - market_factors
        write_path: collectors/macro/treasury_yield_curve.py
        rate_limit: "daily single-source pull"
        degraded_behavior: "missing publication day is warning unless past expected window"
        http_surface:
          - /macro
        owner_consumer:
          - MarketGraph
          - TradingAgent
          - external_agent
        expected_write_cost: "low"
        priority: P2
        production_ready: false
  - batch: B3_market_redundancy_and_altdata
    objective: "Add redundancy only after hot paths stay stable."
    promotion_window: "after B1/B2 production observation"
    candidates:
      - source_id: crypto_exchange_redundancy
        provider: secondary_crypto_exchange
        market: Crypto
        module: crypto_price_redundancy
        api_name_or_dataset: ticker_and_ohlcv_redundancy
        activation_mode: planned
        cadence_class: 30min_crypto_redundancy_pilot
        freshness_sla: "45 minutes after provider verification"
        target_tables:
          - market_bars_intraday
          - market_bars_daily
        write_path: collectors/crypto/secondary_exchange.py
        rate_limit: "30-minute batch; no 5-minute production mode without write-queue proof"
        degraded_behavior: "secondary source stale does not override primary Binance rows; lineage must expose provider"
        http_surface:
          - /crypto
          - /market_data
        owner_consumer:
          - TradingAgent
          - external_agent
        expected_write_cost: "medium; compare write pressure before scheduling"
        priority: P3
        production_ready: false
      - source_id: prediction_market_redundancy
        provider: secondary_prediction_market_or_archive
        market: PredictionMarkets
        module: prediction_market_redundancy
        api_name_or_dataset: market_prices_redundancy
        activation_mode: planned
        cadence_class: 30min_prediction_market_redundancy_pilot
        freshness_sla: "45 minutes after provider verification"
        target_tables:
          - market_pm_markets
          - market_pm_prices
        write_path: collectors/prediction_markets/secondary_prices.py
        rate_limit: "30-minute batch with provider-specific limit"
        degraded_behavior: "secondary source stale/degraded does not fabricate model probability"
        http_surface:
          - /pm_markets
          - /pm_prices
        owner_consumer:
          - TradingAgent
          - MarketGraph
          - external_agent
        expected_write_cost: "medium"
        priority: P3
        production_ready: false
