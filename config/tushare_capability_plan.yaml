version: 2026-07-09
purpose: >
  Market/module capability plan for every Tushare api_name allowlisted by
  SharedSignals. This file separates the production collection plan from the
  HTTP read allowlist: every api_name must have an owner module, market lane,
  cadence policy, and activation mode.

activation_modes:
  scheduled: Runs through collectors/tushare/config.yaml production tiers.
  independent: Runs through a dedicated collector wrapper outside P0-P6.
  event_pilot: Event lane candidate that can run more frequently through cron/tushare_events_collect.sh.
  planned: Assigned to a market/module and cadence, but needs mapping, tests, and pilot proof before scheduled production.

modules:
