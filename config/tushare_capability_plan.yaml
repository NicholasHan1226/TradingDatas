    market: Ashare
    default_cadence: trading_session_5min
    apis:
      - {api_name: stk_mins, mode: scheduled, tier: P0_trading_5min, cadence: trading_session_5min}
      - {api_name: rt_min, mode: scheduled, tier: P0_trading_5min, cadence: trading_session_5min}

