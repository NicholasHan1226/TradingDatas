version: 1
datasets:
  - dataset_id: cn.equity.daily
    aliases:
      - tushare.daily
    domain: market_data
    market: CN
    entity_type: equity_daily_bar
    schema_version: 1.0.0
    fields:
      - {name: market, logical_type: text, nullable: false, selectable: true, filterable: true, sortable: true}
      - {name: symbol, logical_type: text, nullable: false, selectable: true, filterable: true, sortable: true}
      - {name: trade_date, logical_type: text, nullable: false, selectable: true, filterable: true, sortable: true}
      - {name: open, logical_type: float, nullable: true, selectable: true, filterable: false, sortable: false}
      - {name: high, logical_type: float, nullable: true, selectable: true, filterable: false, sortable: false}
      - {name: low, logical_type: float, nullable: true, selectable: true, filterable: false, sortable: false}
      - {name: close, logical_type: float, nullable: true, selectable: true, filterable: false, sortable: false}
      - {name: volume, logical_type: float, nullable: true, selectable: true, filterable: false, sortable: false}
      - {name: amount, logical_type: float, nullable: true, selectable: true, filterable: false, sortable: false}
      - {name: provider, logical_type: text, nullable: true, selectable: true, filterable: false, sortable: false}
      - {name: source_file, logical_type: text, nullable: true, selectable: false, filterable: false, sortable: false}
      - {name: collected_at, logical_type: text, nullable: true, selectable: true, filterable: true, sortable: true}
      - {name: raw_json, logical_type: text, nullable: true, selectable: false, filterable: false, sortable: false}
    primary_key:
      - market
      - symbol
      - trade_date
    default_projection:
      - market
      - symbol
      - trade_date
      - open
      - high
      - low
      - close
      - volume
      - amount
      - provider
      - collected_at
    cadence_class: postclose
    timezone: Asia/Shanghai
    freshness_sla_seconds: 259200
    max_page_size: 500
    max_lookback_days: null
    point_in_time: current_snapshot
    backfill_policy: provider_limited
    empty_data_policy: allowed
    required_scope: market_data
    quota_class: beta_standard
    provider_bindings:
      - provider: tushare
        api_name: daily
        adapter_version: tushare-direct-sqlite.v1
        entitlement_state: unknown
        activation_state: paused
        target_tables:
          - market_bars_daily
    read_model_adapter:
      adapter_version: sqlite-read-model.v1
      primary_table: market_bars_daily
      fixed_field_filters:
        - field: provider
          allowed_values:
            - tushare_daily

