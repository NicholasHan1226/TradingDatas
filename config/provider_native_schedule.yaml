version: 2
dataset_timeout_seconds: 900
rate_budgets:
  standard:
    account_requests_per_run: 64
    provider_requests_per_run: 64
    api_requests_per_run: 16
  intraday:
    account_requests_per_run: 48
    provider_requests_per_run: 48
    api_requests_per_run: 6
    # Per-provider-api request ceilings from bounded QuickSync probing
    # (2026-08-15, non-trading window).  Each interface tolerated 60 serial
    # requests/minute without a rate-limit response, so 60 is a conservative
    # observed lower bound, not the exact provider ceiling.  rt_min now sweeps
    # its full 20-batch universe in one run, so the account/provider ceilings
    # must cover 20 batches (plus headroom) as well.
    api_overrides:
      rt_min: 60
      rt_min_daily: 60
  low_frequency:
    account_requests_per_run: 16
    provider_requests_per_run: 16
    api_requests_per_run: 4
  event:
    # The active event wave currently needs 34 deterministic provider calls
    # per full sweep, including major_news's nine sources and the two
    # three-source firecrawl datasets.  The 2026-08-18..24
    # trusted-empty incident showed ann_date-partitioned announcements need
    # this wave's re-observation semantics instead of the 00:30 daily sweep.
    # 36 keeps the deterministic sweep inside one run while staying below the
    # probed per-interface tolerance (60/min); daily call volume remains
    # trivial (~2k/day).  Event failures retry on the next five-minute run,
    # rather than consuming this sweep's remaining breadth budget.
    account_requests_per_run: 36
    provider_requests_per_run: 36
    api_requests_per_run: 4
    # major_news fans out over nine source literals per daily window; the
    # bounded 2026-08-15/16 weekend executions (9 calls per run, 60/min
    # tolerated per interface in probing) support this per-api ceiling with
    # headroom for transient retries.
    api_overrides:
      major_news: 16
cadences:
  session_minute:
    automatic: true
    availability_after_local: "09:30"
    session_windows_local:
      - {start: "09:30", end: "11:35"}
      - {start: "13:00", end: "15:05"}
    weekdays: [1, 2, 3, 4, 5]
    incremental_mode: request_shape
    partition_frequency: session
    calendar:
      dataset_id: cn.market.trade_calendar
      date_field: cal_date
      open_field: is_open
      open_values: [1]
    # The five-minute timer can start 265 seconds after a collector that
    # completed near the end of its slot.  Keep one bounded slot of slack so
    # the next scheduler tick still plans the next session-minute window.
    minimum_interval_seconds: 240
    failure_retry_seconds: 120
    correction_overlap_days: 0
    correction_overlap_bars: 1
    # Production timer owns the latest eligible window only.  Historical
    # recovery is an explicit bounded one-shot, never an implicit backlog.
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 1
    future_horizon_days: 0
    max_backfill_chunks_per_run: 2
    rate_budget_class: intraday
    retry:
      max_attempts: 3
      base_delay_seconds: 10
      max_delay_seconds: 120
      jitter_seconds: 5
  postclose_daily:
    automatic: true
    availability_after_local: "16:30"
    weekdays: [1, 2, 3, 4, 5]
    incremental_mode: request_shape
    partition_frequency: open_day
    calendar:
      dataset_id: cn.market.trade_calendar
      date_field: cal_date
      open_field: is_open
      open_values: [1]
      previous_open_date_field: pretrade_date
    minimum_interval_seconds: 86400
    failure_retry_seconds: 900
    correction_overlap_days: 0
    correction_overlap_bars: 2
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 1
    future_horizon_days: 0
    max_backfill_chunks_per_run: 3
    rate_budget_class: standard
    retry:
      max_attempts: 3
      base_delay_seconds: 60
      max_delay_seconds: 900
      jitter_seconds: 60
  prior_open_morning:
    # T+1 morning publish: after 08:30 the current window is the previous
    # open trade_date.  daily_reference 00:30 and postclose_daily 16:30 both
    # still request today, which is unpublished until the next morning.
    automatic: true
    availability_after_local: "08:30"
    weekdays: [1, 2, 3, 4, 5]
    incremental_mode: request_shape
    partition_frequency: open_day
    calendar:
      dataset_id: cn.market.trade_calendar
      date_field: cal_date
      open_field: is_open
      open_values: [1]
      previous_open_date_field: pretrade_date
    minimum_interval_seconds: 86400
    failure_retry_seconds: 900
    correction_overlap_days: 0
    correction_overlap_bars: 1
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 1
    future_horizon_days: 0
    max_backfill_chunks_per_run: 3
    rate_budget_class: standard
    current_open_day_lag: 1
    retry:
      max_attempts: 3
      base_delay_seconds: 60
      max_delay_seconds: 900
      jitter_seconds: 60
  daily_reference:
    automatic: true
    availability_after_local: "00:30"
    weekdays: [1, 2, 3, 4, 5, 6, 7]
    incremental_mode: request_shape
    partition_frequency: day
    calendar: null
    minimum_interval_seconds: 86400
    failure_retry_seconds: 900
    correction_overlap_days: 7
    correction_overlap_bars: 0
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 366
    # Only registry-declared trade calendars may use this known-future
    # window.  The generic planner keeps all other daily references at the
    # current available date.
    future_horizon_days: 1
    max_backfill_chunks_per_run: 2
    rate_budget_class: standard
    retry:
      max_attempts: 3
      base_delay_seconds: 60
      max_delay_seconds: 900
      jitter_seconds: 60
  weekly:
    automatic: true
    availability_after_local: "18:00"
    weekdays: [1, 2, 3, 4, 5, 6, 7]
    incremental_mode: request_shape
    partition_frequency: week
    calendar:
      dataset_id: cn.market.trade_calendar
      date_field: cal_date
      open_field: is_open
      open_values: [1]
    minimum_interval_seconds: 604800
    failure_retry_seconds: 1800
    correction_overlap_days: 0
    correction_overlap_bars: 1
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 366
    future_horizon_days: 0
    max_backfill_chunks_per_run: 2
    rate_budget_class: low_frequency
    retry:
      max_attempts: 3
      base_delay_seconds: 120
      max_delay_seconds: 1800
      jitter_seconds: 120
  monthly:
    automatic: true
    availability_after_local: "18:00"
    weekdays: [1, 2, 3, 4, 5, 6, 7]
    incremental_mode: request_shape
    partition_frequency: month
    calendar:
      dataset_id: cn.market.trade_calendar
      date_field: cal_date
      open_field: is_open
      open_values: [1]
    minimum_interval_seconds: 2419200
    failure_retry_seconds: 3600
    correction_overlap_days: 0
    correction_overlap_bars: 1
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 366
    future_horizon_days: 0
    max_backfill_chunks_per_run: 2
    rate_budget_class: low_frequency
    retry:
      max_attempts: 3
      base_delay_seconds: 300
      max_delay_seconds: 3600
      jitter_seconds: 300
  quarterly_reporting:
    automatic: true
    availability_after_local: "20:00"
    weekdays: [1, 2, 3, 4, 5, 6, 7]
    incremental_mode: request_shape
    partition_frequency: quarter
    calendar:
      dataset_id: cn.market.trade_calendar
      date_field: cal_date
      open_field: is_open
      open_values: [1]
    minimum_interval_seconds: 7776000
    failure_retry_seconds: 7200
    correction_overlap_days: 30
    correction_overlap_bars: 1
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 366
    future_horizon_days: 0
    max_backfill_chunks_per_run: 2
    rate_budget_class: low_frequency
    retry:
      max_attempts: 3
      base_delay_seconds: 600
      max_delay_seconds: 7200
      jitter_seconds: 600
  event:
    automatic: true
    availability_after_local: "00:00"
    weekdays: [1, 2, 3, 4, 5, 6, 7]
    incremental_mode: append
    partition_frequency: event
    calendar: null
    minimum_interval_seconds: 900
    failure_retry_seconds: 300
    correction_overlap_days: 2
    correction_overlap_bars: 0
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 1
    future_horizon_days: 0
    max_backfill_chunks_per_run: 2
    rate_budget_class: event
    retry:
      # A same-run retry storm can spend the shared account/provider budget
      # before later fanout partitions run. Preserve breadth: one attempt per
      # partition now, then use failure_retry_seconds for the bounded retry.
      max_attempts: 1
      base_delay_seconds: 0
      max_delay_seconds: 0
      jitter_seconds: 0
  on_demand:
    automatic: false
    availability_after_local: null
    weekdays: [1, 2, 3, 4, 5, 6, 7]
    incremental_mode: on_demand
    partition_frequency: none
    calendar: null
    minimum_interval_seconds: 86400
    failure_retry_seconds: 900
    correction_overlap_days: 0
    correction_overlap_bars: 0
    backfill_start_policy: none
    backfill_lookback_days: 0
    backfill_start_date: null
    backfill_chunk_span_days: 1
    future_horizon_days: 0
    max_backfill_chunks_per_run: 1
    rate_budget_class: standard
    retry:
      max_attempts: 1
      base_delay_seconds: 0
      max_delay_seconds: 0
      jitter_seconds: 0
